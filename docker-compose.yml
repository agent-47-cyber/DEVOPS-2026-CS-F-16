services:
  # 1. MongoDB Database Service with Named Volume Persistence
  mongo:
    image: mongo:7.0
    container_name: portfolio-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - portfolio-network

  # 2. Node.js Express REST API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio-server
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/portfolio_db
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key_rtu_capstone_2026}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminPassword123}
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - portfolio-network

  # 3. React Vite Frontend (Nginx Alpine Multi-Stage Container)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: portfolio-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - portfolio-network

volumes:
  mongo-data:
    name: portfolio-mongo-data

networks:
  portfolio-network:
    name: portfolio-network
    driver: bridge
