apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels:
    app: client
    app.kubernetes.io/part-of: portfolio-capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: portfolio-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
              name: http
          env:
            - name: PORT
              value: "5173"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: client
  labels:
    app: client
    app.kubernetes.io/part-of: portfolio-capstone
spec:
  type: NodePort
  selector:
    app: client
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30080
      name: http

