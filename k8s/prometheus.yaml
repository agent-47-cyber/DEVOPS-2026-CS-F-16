apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
    app.kubernetes.io/part-of: portfolio-capstone
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "/etc/prometheus/alert_rules.yml"

    scrape_configs:
      - job_name: "portfolio-server"
        metrics_path: "/metrics"
        scrape_interval: 5s
        static_configs:
          - targets: ["server:5000"]
            labels:
              app: "portfolio-backend"
              environment: "kubernetes"

      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

  alert_rules.yml: |
    groups:
      - name: portfolio_alert_rules
        rules:
          - alert: HighHttpErrorRate
            expr: (sum(rate(http_requests_total{status_code=~"5.."}[2m])) / sum(rate(http_requests_total[2m]))) > 0.05
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High HTTP 5xx Error Rate detected"
              description: "Over 5% of HTTP requests returned 5xx errors in the last 2 minutes."

          - alert: BackendServerDown
            expr: up{job="portfolio-server"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Portfolio API Backend is down"
              description: "Prometheus has been unable to scrape server:5000/metrics for more than 1 minute."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/part-of: portfolio-capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/part-of: portfolio-capstone
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
      name: http

